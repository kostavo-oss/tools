[tools]
python = "3.14"
uv = "latest"

[env]
# No secret stands here, and no file of them is loaded: what is under [env] is
# shown to an assistant that asks mise for it (.mcp.json).
# Use uv-managed virtualenv at .venv
UV_PROJECT_ENVIRONMENT = ".venv"
# mkdocs-material's "MkDocs 2.0" advisory: mkdocs < 2 is pinned through
# mkdocs-material, so what it warns about can't reach us.
NO_MKDOCS_2_WARNING = "1"

# ── tasks ──────────────────────────────────────────────────────────────────
# Run with `mise run <name>`; list them with `mise tasks`. Everything goes
# through uv, so the project's .venv stays the source of truth. Every Kostavo
# tool has these under these names, and an assistant reaches them through
# mise's MCP server (.mcp.json).

[tasks.dev]
description = "Run the stevin CLI"
alias = "run"
run = "uv run stevin"

[tasks.test]
description = "Run the unit tests (no workspace needed)"
alias = "t"
run = "uv run pytest tests/unit"

[tasks."test:integration"]
description = "Run the integration tests (needs DATABRICKS_HOST / token / warehouse id)"
run = "uv run pytest -m integration"

[tasks."test:lowest"]
description = "Run the tests on the lowest version of every dependency, as ci does"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# an environment of its own, outside the project: nothing here lints or packs it
lowest="${TMPDIR:-/tmp}/stevin-lowest"
rm -rf "$lowest"
uv venv --quiet --python 3.11 "$lowest"
uv pip install --quiet --python "$lowest/bin/python" --resolution lowest-direct -e .
uv pip install --quiet --python "$lowest/bin/python" --group dev
PATH="$lowest/bin:$PATH" "$lowest/bin/python" -m pytest tests/unit
'''

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check ."

[tasks.fmt]
description = "Format with ruff"
alias = "format"
run = "uv run ruff format ."

[tasks.fix]
description = "Repair what ruff can repair: lint with --fix, then format"
run = ["uv run ruff check --fix .", "uv run ruff format ."]

[tasks.typecheck]
description = "Type-check with ty"
alias = "types"
run = "uv run ty check"

[tasks.check]
description = "The gate before a commit: lint, format check, types, unit tests"
run = [
    "uv run ruff check .",
    "uv run ruff format --check .",
    "uv run ty check",
    "uv run pytest tests/unit",
]

[tasks.build]
description = "Build the wheel and the source package into dist/"
run = "uv build"

[tasks.docs]
description = "Preview the docs site at localhost:8000"
run = "uv run --group docs mkdocs serve"

[tasks.screens]
description = "Remake the docs' terminal pictures from the real CLI"
run = "uv run python tests/screens.py docs/assets/screens"

[tasks."docs:build"]
description = "Build the docs site (strict)"
run = "uv run --group docs mkdocs build --strict"

[tasks.ci]
description = "Everything ci runs: the gate, the docs site and the package"
run = [{ task = "check" }, { task = "docs:build" }, { task = "build" }]

[tasks.clean]
description = "Remove what a build and the tools leave behind"
run = "rm -rf dist site .pytest_cache .ruff_cache"
