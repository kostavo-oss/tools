[project]
name = "stevin"
version = "0.3.0a1"
description = "Safe plan/apply migrations for Unity Catalog tables and schemas"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Misja Pronk" }]
keywords = [
    "databricks",
    "unity-catalog",
    "delta-lake",
    "schema-migration",
    "infrastructure-as-code",
    "data-engineering",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
dependencies = [
    "databricks-sdk>=0.30",
    "pyyaml>=6.0.3",
    "rich>=13.7",
    "sqlglot>=30.18.0",
    "typer>=0.17.5",
]

[project.urls]
Homepage = "https://github.com/kostavo-oss/tools"
Documentation = "https://kostavo-oss.github.io/tools/stevin/"
Repository = "https://github.com/kostavo-oss/tools"
Issues = "https://github.com/kostavo-oss/tools/issues"
Changelog = "https://github.com/kostavo-oss/tools/blob/main/packages/stevin/CHANGELOG.md"

[project.scripts]
stevin = "stevin.cli:main"
# the name this was released under: it says so, and runs stevin
deltaplan = "stevin.formerly:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stevin"]

[tool.hatch.build.targets.sdist]
# What a source distribution is for: the code, its tests, and the three files
# that say what it is. Everything else in the repository — the docs site, the
# Action, the examples, editor and CI configuration, the lock file, and the
# last deltaplan release, which is a package of its own — is the repo's.
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0",
    "ruff>=0.6",
    "syrupy>=4.8",
    "ty>=0.0.1a1",
    "types-pyyaml>=6.0.12",
]
docs = [
    "mkdocs-material>=9.7.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the GitHub Action's comment script lives beside action.yml, not in the package
pythonpath = ["action"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a live workspace (DATABRICKS_HOST / token / warehouse id)",
]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]
# tests import sibling modules (e.g. `helpers`) the way pytest runs them, and
# the Action's comment script from action/
extra-paths = ["tests", "action"]
