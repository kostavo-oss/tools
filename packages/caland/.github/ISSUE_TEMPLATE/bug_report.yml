name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `caland`
        2. ...
  - type: input
    id: version
    attributes:
      label: Caland version
      placeholder: "0.6.0  (caland --version)"
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15"
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: "Chrome 141"
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
  - type: textarea
    id: terminal
    attributes:
      label: What the terminal printed
      description: >
        What the terminal that runs caland shows. When the page says "caland
        failed", there is a line there that says where: `caland: POST /api/…
        failed: …`. Leave out a link that ends in `#…`: what comes after the
        `#` is a key. Never paste a secret's value.
      render: text
