name: stevin
description: Safe plan/apply migrations for Unity Catalog tables and schemas
author: Misja Pronk
branding:
  icon: layers
  color: blue

inputs:
  command:
    description: "`plan` to show what would change, `apply` to plan and run it, or `drift` to check live tables against their specs."
    default: plan
  target:
    description: The target in stevin.yml to plan for.
    required: true
  config:
    description: Path to stevin.yml, relative to working-directory. Left out, it is found by looking in working-directory and above.
    default: ""
  working-directory:
    description: Where the stevin project lives.
    default: .
  clone:
    description: "`plan` and `apply`: add a SHALLOW CLONE of each table before a step that risks its data."
    default: "false"
  comment:
    description: On a pull request, post the result as a comment — updating stevin's previous one rather than adding another.
    default: "true"
  allow-destructive:
    description: "`apply` only: let the plan drop something. Without it, a plan that would stops before running anything."
    default: "false"
  fail-on-drift:
    description: "`drift` only: fail the job when live tables have drifted."
    default: "true"
  github-token:
    description: Token used to comment on the pull request.
    default: ${{ github.token }}

outputs:
  has-changes:
    description: "`true` when the plan would do something (or, for `drift`, when there is drift)."
    value: ${{ steps.run.outputs.has-changes }}
  plan-file:
    description: The plan as JSON, for `stevin apply`. Empty for `drift`.
    value: ${{ steps.run.outputs.plan-file }}
  markdown-file:
    description: The rendered comment.
    value: ${{ steps.run.outputs.markdown-file }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7

    # Inputs reach the script through the environment, never by `${{ }}` inside
    # `run:` — interpolating them there would let a crafted input run as shell.
    - id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        TARGET: ${{ inputs.target }}
        CONFIG: ${{ inputs.config }}
        CLONE: ${{ inputs.clone }}
        ALLOW_DESTRUCTIVE: ${{ inputs.allow-destructive }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        case "$COMMAND" in
          plan|apply|drift) ;;
          *) echo "::error::command must be plan, apply or drift, not '$COMMAND'"; exit 1 ;;
        esac

        # stevin is installed from this action's own checkout, so the action
        # and the tool it runs are always the same version.
        stevin() { uvx --from "$ACTION_PATH" stevin "$@"; }

        out="$RUNNER_TEMP/stevin"
        mkdir -p "$out"
        markdown="$out/$COMMAND.md"

        # The outputs and the job summary, written as soon as there is a result
        # to show — before anything is applied, so a run that fails halfway
        # still has its plan in the summary and its outputs for a later step.
        publish() {
          echo "has-changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "markdown-file=$markdown" >> "$GITHUB_OUTPUT"
          cat "$markdown" >> "$GITHUB_STEP_SUMMARY"
        }

        if [ "$COMMAND" != drift ]; then
          plan_file="$out/plan.json"
          args=(plan -t "$TARGET")
          if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
          args+=(-f json -o "$plan_file")
          if [ "$CLONE" = true ]; then args+=(--clone); fi
          stevin "${args[@]}"
          # The comment is rendered from the plan file, so it shows exactly what
          # `apply` of that file would run.
          stevin show "$plan_file" -f md -o "$markdown"
          has_changes=$(uv run --no-project python -c \
            'import json, sys; print(str(bool(json.load(open(sys.argv[1]))["steps"])).lower())' \
            "$plan_file")
          echo "plan-file=$plan_file" >> "$GITHUB_OUTPUT"
          publish
          if [ "$COMMAND" = apply ] && [ "$has_changes" = true ]; then
            # The same plan the summary shows, run by the same version.
            args=(apply "$plan_file")
            if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
            if [ "$ALLOW_DESTRUCTIVE" = true ]; then args+=(--allow-destructive); fi
            set +e
            stevin "${args[@]}"
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              # Under the plan it was running, so the two are read together.
              {
                echo
                echo "**\`stevin apply\` failed** (exit $code) while running the plan above. The job log has the step that stopped it."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::stevin apply failed (exit $code). The plan it was running is in the job summary."
              exit "$code"
            fi
          fi
        else
          # drift exits 2 when there is drift; anything else non-zero is a failure.
          args=(drift -t "$TARGET")
          if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); fi
          args+=(-f md -o "$markdown")
          set +e
          stevin "${args[@]}"
          code=$?
          set -e
          case "$code" in
            0) has_changes=false ;;
            2) has_changes=true ;;
            *) exit "$code" ;;
          esac
          echo "plan-file=" >> "$GITHUB_OUTPUT"
          publish
        fi

    - if: inputs.comment == 'true' && github.event.pull_request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        BODY_FILE: ${{ steps.run.outputs.markdown-file }}
        ACTION_PATH: ${{ github.action_path }}
      run: uv run --no-project python "$ACTION_PATH/action/upsert_comment.py" "$BODY_FILE"

    - if: inputs.command == 'drift' && inputs.fail-on-drift == 'true' && steps.run.outputs.has-changes == 'true'
      shell: bash
      run: |
        echo "::error::Live tables have drifted from their specs. See the job summary."
        exit 1
