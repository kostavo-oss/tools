name: release

# A release is a tag: `git tag v1.2.3 && git push origin v1.2.3`, on the commit
# whose pyproject.toml says 1.2.3.
#
# The shared workflow checks that the two agree, runs the gate, and builds. The
# publishing is done here and not there: PyPI's Trusted Publisher is this
# repository and this file (environment `pypi` — no token), and a reusable
# workflow can't be one.
# https://docs.pypi.org/trusted-publishers/troubleshooting/#reusable-workflows-on-github

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: kostavo-oss/.github/.github/workflows/python-release.yml@main

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
