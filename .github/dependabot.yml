# Keeps the workflows' actions and the one locked dependency set current.
# Dependabot's pull requests get no secrets, so the live suite skips on them;
# ci still runs. A lock-file update changes no package version, so it is never
# a release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
