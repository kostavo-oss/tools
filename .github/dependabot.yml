# Keeps the workflows' actions and the locked dependencies current. Dependabot's
# pull requests get no secrets, and ci needs none: its tests reach no workspace.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
