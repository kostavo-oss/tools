# yaml-language-server: $schema=https://kostavo-oss.github.io/stevin/schema/project.json
# A stevin project: where the specs are, and what a target substitutes into
# them. Run `stevin validate -t dev` from this directory to try it.
version: 1

# Files or directories holding specs, relative to this file. Directories are
# searched recursively for *.yml / *.yaml.
specs: [tables]

# Where `apply` keeps its run history and lock. stevin creates the schema
# and the three tables inside it on first use.
history_schema: ${catalog}.stevin

targets:
  dev:
    vars:
      catalog: dev
    # Which workspace: a ~/.databrickscfg profile (`databricks auth login
    # --profile dev`). Without one, the SDK's defaults apply.
    # profile: dev
    # Optional — falls back to $DATABRICKS_WAREHOUSE_ID.
    # warehouse_id: abc123def456

  prod:
    vars:
      catalog: prod
    # The default for every schema. `additive` never drops a table; `strict`
    # drops tables stevin created once their spec is deleted. Tables it didn't
    # create are left alone in both.
    mode: additive

# Per-schema overrides of the target's mode.
schemas:
  ${catalog}.sales: additive
