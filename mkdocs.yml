site_name: Kostavo tools
site_description: Small tools for the ugly gaps on Databricks.
site_author: Misja Pronk
site_url: https://kostavo-oss.github.io/tools/

repo_name: kostavo-oss/tools
repo_url: https://github.com/kostavo-oss/tools
edit_uri: edit/main/docs/

copyright: Apache-2.0 © Misja Pronk

theme:
  name: material
  font: false # the system font stack: native, calm, nothing fetched
  icon:
    repo: fontawesome/brands/github
    logo: material/waves
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # Each tool's pages quote files beside them: stevin's pictures and the specs
  # that made them, lely's contributing guide and changelog.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
        - packages/stevin/docs
        - packages/lely/docs
        - packages/leeghwater/docs
        - packages/caland/docs
      check_paths: true
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # One site from four docs folders: each tool keeps its own mkdocs.yml with its
  # name and its pages, and is served under /<tool>/.
  - monorepo

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kostavo-oss/tools

nav:
  - Home: index.md
  - stevin: '!include packages/stevin/mkdocs.yml'
  - lely: '!include packages/lely/mkdocs.yml'
  - leeghwater: '!include packages/leeghwater/mkdocs.yml'
  - caland: '!include packages/caland/mkdocs.yml'
  - contracts: '!include packages/contracts/mkdocs.yml'
