[project]
name = "lely"
version = "0.0.1"
description = "One plan for your whole Databricks deploy: the bundle and the steps around it, reviewed before anything runs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Misja Pronk", email = "misja@prorexconsultancy.nl" }]
keywords = ["databricks", "asset-bundles", "deployment", "infrastructure-as-code", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "databricks-sdk>=0.89",
    "pyyaml>=6.0.3",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/kostavo-oss/lely"
Documentation = "https://kostavo-oss.github.io/lely/"
Repository = "https://github.com/kostavo-oss/lely"
Issues = "https://github.com/kostavo-oss/lely/issues"

[project.scripts]
lely = "lely.cli:main"

# The plugins lely ships register exactly as anyone's would.
[project.entry-points."lely.steps"]
bundle = "lely.steps.bundle:Bundle"
command = "lely.steps.command:Command"
stevin = "lely.steps.stevin:Stevin"
"bundle.run" = "lely.steps.bundle_run:BundleRun"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lely"]

[dependency-groups]
dev = [
    "jsonschema>=4.20",
    "pytest>=8.0",
    "ruff>=0.6",
    "syrupy>=4.8",
    "ty>=0.0.1a1",
    "types-pyyaml>=6.0.12",
]
# the docs site: `uv run --group docs mkdocs serve`
docs = [
    "mkdocs-material>=9.7.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the fakes live beside the tests, not in the package
pythonpath = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a live workspace and the Databricks CLI",
]

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]
extra-paths = ["tests"]
