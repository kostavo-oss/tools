[project]
name = "maeslant"
version = "0.4.1"
description = "A keyboard-driven terminal UI for managing Databricks secrets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Misja Pronk", email = "misja@prorexconsultancy.nl" }]
keywords = [
    "databricks",
    "secrets",
    "secret-manager",
    "tui",
    "terminal",
    "textual",
    "cli",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "textual>=2.0",
    "databricks-sdk>=0.30",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/kostavo-oss/maeslant"
Repository = "https://github.com/kostavo-oss/maeslant"
Issues = "https://github.com/kostavo-oss/maeslant/issues"
Changelog = "https://github.com/kostavo-oss/maeslant/blob/main/CHANGELOG.md"

[project.scripts]
maeslant = "maeslant.app:main"
# the names this was released under: they say so, and run maeslant
isolinear = "maeslant.formerly:main"
iso = "maeslant.formerly:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maeslant"]

[tool.hatch.build.targets.sdist]
# the last isolinear release is a package of its own
exclude = ["isolinear-shim"]

[dependency-groups]
dev = [
    "textual-dev>=1.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "types-pyyaml>=6.0.12.20260518",
    "pytest-textual-snapshot>=1.0.0",
]
docs = [
    "mkdocs-material>=9.7.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]
# tests import sibling modules (e.g. `fakes`) the way pytest runs them
extra-paths = ["tests"]

[tool.ty.src]
# docs/redesign holds mockup-rendering scripts that use an out-of-project lib
# (Pillow, via `uv run --with`); they aren't shipped code, so don't type-check them.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
