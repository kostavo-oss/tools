[project]
name = "lely"
version = "0.3.0"
description = "One plan for your whole Databricks deploy: the bundle and the steps around it, reviewed before anything runs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Misja Pronk" }]
keywords = ["databricks", "asset-bundles", "deployment", "infrastructure-as-code", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
# Each floor is the oldest version the unit tests pass on: CI holds them, in the job
# `test (lowest dependencies)`.
dependencies = [
    "databricks-sdk>=0.89",
    # the first with wheels for Python 3.14
    "pyyaml>=6.0.3",
    "rich>=13.7",
    # Older ones install beside a click they don't work with: up to 0.15.3 every
    # `--help` is a traceback, and from 0.16.0 to 0.17.4 a command given no `-t` runs
    # without one. (0.15.4 keeps to an older click, whose test runner the suite can't use.)
    "typer>=0.17.5",
]

[project.urls]
Homepage = "https://github.com/kostavo-oss/lely"
Documentation = "https://kostavo-oss.github.io/lely/"
Repository = "https://github.com/kostavo-oss/lely"
Issues = "https://github.com/kostavo-oss/lely/issues"
Changelog = "https://github.com/kostavo-oss/lely/blob/main/CHANGELOG.md"

[project.scripts]
lely = "lely.cli:main"

# The plugins lely ships register exactly as anyone's would.
[project.entry-points."lely.steps"]
bundle = "lely.steps.bundle:Bundle"
stevin = "lely.steps.stevin:Stevin"
"bundle.run" = "lely.steps.bundle_run:BundleRun"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lely"]

# A source package holds the code, its tests and the files that say what it is —
# what is listed here and nothing else. The docs site, the specs, the workflows
# and the lock file are the repository's.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[dependency-groups]
dev = [
    "jsonschema>=4.21",
    "pytest>=8.0",
    "ruff>=0.6",
    "syrupy>=4.8",
    "ty>=0.0.1a1",
    "types-pyyaml>=6.0.12",
]
# the docs site: `uv run --group docs mkdocs serve`
docs = [
    "mkdocs-material>=9.7.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the fakes live beside the tests, not in the package
pythonpath = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a live workspace and the Databricks CLI",
]

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]
extra-paths = ["tests"]
