[project]
name = "sluis"
version = "0.0.1"
description = "One plan and one apply for a whole Databricks deploy: pre-deploy steps, the bundle, post-deploy steps"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Misja Pronk", email = "misja@prorexconsultancy.nl" }]
keywords = ["databricks", "asset-bundles", "deployment", "infrastructure-as-code", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = [
    "databricks-sdk>=0.89",
    "pyyaml>=6.0.3",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
sluis = "sluis.cli:main"

# Built-in steps register exactly as a plugin's would.
[project.entry-points."sluis.steps"]
command = "sluis.steps.command:Command"
deltaplan = "sluis.steps.deltaplan:Deltaplan"
"bundle.run" = "sluis.steps.bundle_run:BundleRun"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sluis"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "syrupy>=4.8",
    "ty>=0.0.1a1",
    "types-pyyaml>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the fakes live beside the tests, not in the package
pythonpath = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs a live workspace and the Databricks CLI",
]

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]
extra-paths = ["tests"]
