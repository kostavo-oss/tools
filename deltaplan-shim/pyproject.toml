# The last release of `deltaplan` on PyPI. It has no code of its own: it
# installs stevin, which is what deltaplan is called now, and forwards to it.
#
# Nothing publishes this — no workflow builds it, and stevin's own sdist leaves
# the directory out. It goes out once, by hand, right after the first stevin
# release is on PyPI:
#
#   1. set `version` here, and the `stevin>=` beside it, to that stevin version
#   2. uv build deltaplan-shim --out-dir deltaplan-shim/dist
#   3. uv publish deltaplan-shim/dist/*   (the `deltaplan` project's own token
#      or Trusted Publisher — not stevin's)
[project]
name = "deltaplan"
version = "0.3.0a1"
description = "deltaplan is now stevin — this release installs it"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Misja Pronk" }]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["stevin>=0.3.0a1"]

[project.urls]
Homepage = "https://github.com/kostavo-oss/stevin"
Documentation = "https://kostavo-oss.github.io/stevin/installation/#coming-from-deltaplan"

[project.scripts]
# `uv tool install deltaplan` only links commands this package declares itself,
# so the old command is declared here as well as in stevin
deltaplan = "stevin.formerly:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deltaplan"]
