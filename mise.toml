[tools]
python = "3.14"
uv = "latest"

[env]
UV_PROJECT_ENVIRONMENT = ".venv"
# mkdocs-material's "MkDocs 2.0" advisory: we pin mkdocs < 2 through
# mkdocs-material, so what it warns about can't reach us.
NO_MKDOCS_2_WARNING = "1"

# ── tasks ──────────────────────────────────────────────────────────────────
# Run with `mise run <name>`; list them with `mise tasks`.

[tasks.dev]
description = "Run the lely CLI"
alias = "run"
run = "uv run lely"

[tasks.test]
description = "Run the unit tests (no workspace needed)"
alias = "t"
run = "uv run pytest tests/unit"

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check ."

[tasks.fmt]
description = "Auto-format with ruff"
alias = "format"
run = "uv run ruff format ."

[tasks.typecheck]
description = "Type-check with ty"
alias = "types"
run = "uv run ty check"

[tasks.docs]
description = "Preview the docs site at localhost:8000"
run = "uv run --group docs mkdocs serve"

[tasks."docs:build"]
description = "Build the docs site (strict)"
run = "uv run --group docs mkdocs build --strict"

[tasks.check]
description = "Full pre-commit gate: lint + format check + types + unit tests"
run = [
    "uv run ruff check .",
    "uv run ruff format --check .",
    "uv run ty check",
    "uv run pytest tests/unit",
]
